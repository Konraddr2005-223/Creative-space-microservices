server:
  port: 8081

spring:
  application:
    name: resource-service
  config:
    import: optional:classpath:observability-defaults.yml
  datasource:
    url: ${RESOURCE_DB_URL:jdbc:postgresql://localhost:5432/resource_db}
    username: ${RESOURCE_DB_USER:resource}
    password: ${RESOURCE_DB_PASSWORD:resource}
  jpa:
    open-in-view: false
    hibernate:
      # WHY validate: Flyway owns the schema. ddl-auto=update would hide migration mistakes.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/creative-space}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/creative-space/protocol/openid-connect/certs}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
