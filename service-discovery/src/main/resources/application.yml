spring:
  application:
    name: service-discovery

server:
  port: 8761

eureka:
  client:
    # WHY false/false: this process IS the registry.
    # Registering/fetching itself is only useful in peer-aware clusters.
    register-with-eureka: false
    fetch-registry: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
