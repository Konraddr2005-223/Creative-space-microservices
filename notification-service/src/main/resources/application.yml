server:
  port: 8084

spring:
  application:
    name: notification-service
  config:
    import: optional:classpath:observability-defaults.yml
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5435/notification_db}
    username: ${NOTIFICATION_DB_USER:notification}
    password: ${NOTIFICATION_DB_PASSWORD:notification}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      # WHY: continue the W3C/B3 context stored by the outbox publisher into consumer spans.
      observation-enabled: true
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

app:
  kafka:
    booking-events-topic: ${BOOKING_EVENTS_TOPIC:booking.events}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
