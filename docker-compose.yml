# Local infra for database-per-service.
# Separate Postgres containers (not one DB with many schemas) so each service
# owns its data store end-to-end — closer to real microservice boundaries.
# Credentials are DEV defaults only; override via env in non-local setups.

services:
  postgres-resource:
    image: postgres:17-alpine
    container_name: cs-postgres-resource
    environment:
      POSTGRES_DB: ${RESOURCE_DB_NAME:-resource_db}
      POSTGRES_USER: ${RESOURCE_DB_USER:-resource}
      POSTGRES_PASSWORD: ${RESOURCE_DB_PASSWORD:-resource}
    ports:
      - "${RESOURCE_DB_PORT:-5432}:5432"
    volumes:
      - postgres-resource-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-booking:
    image: postgres:17-alpine
    container_name: cs-postgres-booking
    environment:
      POSTGRES_DB: ${BOOKING_DB_NAME:-booking_db}
      POSTGRES_USER: ${BOOKING_DB_USER:-booking}
      POSTGRES_PASSWORD: ${BOOKING_DB_PASSWORD:-booking}
    ports:
      - "${BOOKING_DB_PORT:-5433}:5432"
    volumes:
      - postgres-booking-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-payment:
    image: postgres:17-alpine
    container_name: cs-postgres-payment
    environment:
      POSTGRES_DB: ${PAYMENT_DB_NAME:-payment_db}
      POSTGRES_USER: ${PAYMENT_DB_USER:-payment}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD:-payment}
    ports:
      - "${PAYMENT_DB_PORT:-5434}:5432"
    volumes:
      - postgres-payment-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # WHY Keycloak (not a custom user-service): OAuth2/OIDC is the enterprise default.
  # JWT validation stays at the Gateway for now; downstream services trust the internal network.
  # Port 8180 on host avoids colliding with api-gateway (:8080).
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.0
    container_name: cs-keycloak
    command:
      - start-dev
      - --import-realm
      - --health-enabled=true
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8080
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - ./infra/keycloak/creative-space-realm.json:/opt/keycloak/data/import/creative-space-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # WHY KRaft (no Zookeeper): fewer moving parts for local demos; Bitnami image is common in tutorials.
  # advertised localhost:9092 so host-run Spring Boot apps can produce/consume.
  kafka:
    image: bitnami/kafka:3.9
    container_name: cs-kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  postgres-notification:
    image: postgres:17-alpine
    container_name: cs-postgres-notification
    environment:
      POSTGRES_DB: ${NOTIFICATION_DB_NAME:-notification_db}
      POSTGRES_USER: ${NOTIFICATION_DB_USER:-notification}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification}
    ports:
      - "${NOTIFICATION_DB_PORT:-5435}:5432"
    volumes:
      - postgres-notification-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # WHY Zipkin: lightweight UI to prove Micrometer spans across Gateway, Feign, and Kafka.
  zipkin:
    image: openzipkin/zipkin:3.4
    container_name: cs-zipkin
    ports:
      - "${ZIPKIN_PORT:-9411}:9411"

volumes:
  postgres-resource-data:
  postgres-booking-data:
  postgres-payment-data:
  postgres-notification-data:
