server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: optional:classpath:observability-defaults.yml
  cloud:
    gateway:
      discovery:
        locator:
          # WHY: auto-routes /{serviceId}/** from Eureka without hardcoding every new service.
          # Trade-off: less explicit than declarative routes - fine for early portfolio stages.
          enabled: true
          lower-case-service-id: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # WHY issuer-uri: validates JWT `iss` (tokens from host use localhost:8180).
          # WHY separate jwk-set-uri: Docker apps fetch certs via keycloak:8080 while iss stays localhost.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/creative-space}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/creative-space/protocol/openid-connect/certs}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
