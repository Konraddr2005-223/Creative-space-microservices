server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          # WHY: auto-routes /{serviceId}/** from Eureka without hardcoding every new service.
          # Trade-off: less explicit than declarative routes - fine for early portfolio stages.
          enabled: true
          lower-case-service-id: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
