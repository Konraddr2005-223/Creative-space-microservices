# Imported by each service via: spring.config.import=optional:classpath:observability-defaults.yml
# Override ZIPKIN_ENDPOINT / sampling in real envs.

management:
  tracing:
    sampling:
      # WHY 1.0 locally: every request shows up in Zipkin while demoing. Lower in prod.
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
